
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pemindai QR Siswa</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f4f6f8;
    }
    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      background: white;
    }
    #status {
      font-weight: bold;
      margin: 20px;
    }
  </style>
</head>
<body>
  <h2>📷 Pemindai QR Siswa</h2>
  <div id="reader"></div>
  <p id="status">Menyiapkan kamera...</p>

  <script>
    const pemindai = new Html5Qrcode("reader");

    pemindai.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      function(kodeQR) {
        document.getElementById("status").textContent =
          "QR berhasil dibaca: " + kodeQR;
      }
    ).catch(function(error) {
      document.getElementById("status").textContent =
        "Kamera gagal dibuka: " + error;
    });
  </script>
</body>
</html>
